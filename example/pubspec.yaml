name: golden_matrix_example
description: Example usage of golden_matrix package.

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  golden_matrix:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    # Regression fixture for golden_matrix 1.1.2: a filename with square
    # brackets is the upstream convention for variable fonts
    # (Geist[wght].ttf, Inter[opsz,wght].ttf). flutter_tools percent-encodes
    # such a key in FontManifest.json, which used to make the asset
    # unloadable — and took the whole test file down with it.
    # Guarded by example/test/golden/bracketed_font_regression_test.dart.
    # The file itself is a copy of the SDK's Roboto-Regular.
    - family: BracketedVariable
      fonts:
        - asset: assets/fonts/Bracketed[wght].ttf
